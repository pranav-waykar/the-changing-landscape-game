<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Changing Landscape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-wrapper">
    <main id="stage">
      <canvas id="game-canvas"></canvas>
      <div id="stage-controls">
        <button id="pause-toggle-button" aria-label="Pause or Resume Game">Pause (P)</button>
        <button id="audio-toggle-button" aria-label="Toggle Sound">Sound: on</button>
      </div>
      <button id="call-button" aria-label="Call Flock">Call</button>
      <div id="overlay"></div>
    </main>
    <nav id="presentation-bar" aria-label="Stage Navigation"></nav>
  </div>

  <!-- Game Engine Modules (ordered by dependency) -->
  <script src="js/config.js"></script>
  <script src="js/math.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/entities/sheep.js"></script>
  <script src="js/entities/flock.js"></script>
  <script src="js/entities/vehicle.js"></script>
  <script src="js/entities/traffic.js"></script>
  <script src="js/world/landscape.js"></script>
  <script src="js/world/road.js"></script>
  <script src="js/world/structures.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
